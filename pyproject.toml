[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-m9n-cli"
version = "1.0.0"
description = "Fedora USB diagnostics and live monitoring for SparkFun u-blox NEO-M9N GNSS receivers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3", "Topic :: System :: Hardware"]

[project.scripts]
m9n = "m9n.cli:main"

[tool.setuptools]
packages = ["m9n"]

