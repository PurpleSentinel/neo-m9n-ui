[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-m9n-cli"
version = "2.0.0"
description = "GNOME desktop diagnostics and live monitoring for SparkFun u-blox NEO-M9N GNSS receivers over USB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# PyGObject, GTK 4 and libadwaita come from the distribution (dnf install gtk4 libadwaita python3-gobject).
dependencies = []
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",
               "Environment :: X11 Applications :: GTK", "Intended Audience :: End Users/Desktop",
               "Topic :: System :: Hardware"]

[project.gui-scripts]
m9n = "m9n.gui.application:main"

[tool.setuptools]
packages = ["m9n", "m9n.gui"]
