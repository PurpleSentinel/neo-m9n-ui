[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-m9n-monitor"
version = "3.1.5"
description = "GNOME desktop diagnostics and live monitoring for SparkFun u-blox NEO-M9N GNSS receivers over USB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# PyGObject, GTK 4 and libadwaita come from the distribution
# (dnf install gtk4 libadwaita python3-gobject gobject-introspection).
dependencies = []
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",
               "Environment :: X11 Applications :: GTK", "Intended Audience :: End Users/Desktop",
               "Topic :: System :: Hardware"]

[project.gui-scripts]
m9n = "m9n.gui.application:main"

[tool.setuptools]
packages = ["m9n", "m9n.gui"]

[tool.setuptools.package-data]
"m9n.gui" = ["data/*.desktop", "data/*.xml", "data/icons/hicolor/*/apps/*.svg"]
